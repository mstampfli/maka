name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # The custom asm context switch, validated on BOTH architectures from one
  # Linux runner: x86_64 natively, aarch64 by cross-compiling and running the
  # emitted C under qemu-user.  100 fibers x 50 yields = 5000 switches -> 100.
  linux:
    name: fiber switch (linux x86_64 + aarch64/qemu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install aarch64 cross toolchain + qemu-user
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu qemu-user
      - name: Build makac
        run: cargo build --release --bin makac
      - name: x86_64 asm switch
        shell: bash
        run: |
          set +e
          out=$(./target/release/makac tests/ci/fiber_smoke.maka -o smoke --run 2>&1)
          echo "$out"
          echo "$out" | tail -n1 | grep -qx 100 || { echo "FAIL x86_64"; exit 1; }
          echo "PASS: x86_64 custom asm switch (5000 context switches)"
      - name: aarch64 asm switch (qemu-user)
        shell: bash
        run: |
          set +e
          ./target/release/makac tests/ci/fiber_smoke.maka --emit-c -o smoke_aa.c || { echo "emit failed"; exit 1; }
          aarch64-linux-gnu-gcc -O1 smoke_aa.c -o smoke_aa -lpthread -static 2>cc.err
          if [ ! -x smoke_aa ]; then echo "cross-compile failed"; cat cc.err; exit 1; fi
          out=$(qemu-aarch64 ./smoke_aa 2>&1)
          echo "$out"
          echo "$out" | tail -n1 | grep -qx 100 || { echo "FAIL aarch64"; exit 1; }
          echo "PASS: aarch64 custom asm switch under qemu (5000 context switches)"

  # Windows uses the ucontext / native-fiber fallback (no custom asm), compiled
  # with mingw gcc.
  windows:
    name: fiber switch (windows fallback)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install MinGW (makac compiles its C output with gcc)
        run: choco install mingw --no-progress -y
        shell: pwsh
      - name: Build makac
        run: cargo build --release --bin makac
      - name: Fiber switch smoke
        shell: bash
        run: |
          set +e
          export CC=gcc
          gcc --version | head -1
          ./target/release/makac.exe tests/ci/fiber_smoke.maka -o fiber_smoke.exe --run > out.txt 2>&1
          echo "rc=$?"
          cat out.txt
          tail -n1 out.txt | grep -qx 100 || { echo "FAIL windows"; exit 1; }
          echo "PASS: windows fallback (5000 context switches)"

  # macOS aarch64 uses the custom asm switch (validated above via qemu), but the
  # runtime's socket/network C layer has a pre-existing, incomplete macOS port
  # (header ordering, __DARWIN asm-label collisions) unrelated to the switch.
  # Kept informational until that port lands.
  macos:
    name: fiber switch (macos aarch64) [WIP macOS socket port]
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build makac
        run: cargo build --release --bin makac
      - name: Fiber switch smoke (informational)
        shell: bash
        run: |
          set +e
          ./target/release/makac tests/ci/fiber_smoke.maka -o fiber_smoke --run > out.txt 2>&1
          echo "rc=$?"; cat out.txt | tail -30
          tail -n1 out.txt | grep -qx 100 && echo "PASS macos" || echo "known WIP: macOS socket-layer port"
