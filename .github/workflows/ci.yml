name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  fiber-switch:
    name: fiber switch (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install MinGW (Windows only - makac compiles its C output with gcc)
        if: runner.os == 'Windows'
        run: choco install mingw --no-progress -y
        shell: pwsh

      - name: Build makac
        run: cargo build --release --bin makac

      - name: Fiber context-switch smoke test
        shell: bash
        env:
          RUST_BACKTRACE: "1"
        run: |
          set -uo pipefail
          BIN=target/release/makac
          if [ "$RUNNER_OS" = "Windows" ]; then
            BIN=target/release/makac.exe
            export CC=gcc
            gcc --version | head -1 || true
          fi
          echo "== runner=$RUNNER_OS arch=$(uname -m) CC=${CC:-cc} =="
          echo "== step 1: emit C =="
          "$BIN" tests/ci/fiber_smoke.maka --emit-c -o smoke.c 2>&1 | head -60
          echo "emit rc=${PIPESTATUS[0]}"
          echo "== step 2: compile + run =="
          "$BIN" tests/ci/fiber_smoke.maka -o fiber_smoke --run > run.out 2>&1
          rc=$?
          echo "run rc=$rc"
          echo "----- output -----"; cat run.out; echo "------------------"
          tail -n1 run.out | grep -qx 100 \
            || { echo "FAIL: expected 100 on $RUNNER_OS ($(uname -m))"; exit 1; }
          echo "PASS: 5000 cooperative context switches on $RUNNER_OS ($(uname -m))"
