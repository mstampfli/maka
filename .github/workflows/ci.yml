name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  fiber-switch:
    name: fiber switch (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install MinGW (Windows only - makac compiles its C output with gcc)
        if: runner.os == 'Windows'
        run: choco install mingw --no-progress -y
        shell: pwsh

      - name: Build makac
        run: cargo build --release --bin makac

      - name: Fiber context-switch smoke test
        shell: bash
        env:
          RUST_BACKTRACE: "1"
        run: |
          set +e                       # GitHub's shell adds -e; undo it so diagnostics print
          BIN=target/release/makac
          if [ "$RUNNER_OS" = "Windows" ]; then
            BIN=target/release/makac.exe
            export CC=gcc
            gcc --version | head -1
          fi
          echo "== runner=$RUNNER_OS arch=$(uname -m) CC=${CC:-cc} =="
          echo "== step 1: emit C =="
          "$BIN" tests/ci/fiber_smoke.maka --emit-c -o smoke.c 2>&1 | head -40
          echo "emit rc=${PIPESTATUS[0]}"
          echo "== step 2: makac compile only (surfaces cc/asm/link errors) =="
          "$BIN" tests/ci/fiber_smoke.maka -o fiber_smoke > build.log 2>&1
          echo "build rc=$?"
          echo "----- build.log -----"; head -60 build.log; echo "---------------------"
          echo "== step 3: run =="
          ./fiber_smoke > run.out 2>&1
          echo "run rc=$?"
          echo "----- output -----"; cat run.out; echo "------------------"
          if tail -n1 run.out | grep -qx 100; then
            echo "PASS: 5000 cooperative context switches on $RUNNER_OS ($(uname -m))"
          else
            echo "FAIL on $RUNNER_OS ($(uname -m))"; exit 1
          fi
