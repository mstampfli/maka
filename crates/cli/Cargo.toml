# `maka` — the project front-end (new / build / run / test / lint), a thin
# cargo-like wrapper around the `makac` compiler.  Std-only: it shells out to
# `makac` rather than linking the compiler crates.
[[bin]]
name = "maka"
path = "src/main.rs"

